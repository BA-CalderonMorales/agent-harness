# Continuous Integration for Agent Harness
# Runs on all PRs and pushes to main/develop

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.25'

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  # Build and basic checks
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build -v ./cmd/agent-harness

      - name: Build with kairos tag
        run: go build -tags kairos -v ./cmd/agent-harness
        continue-on-error: true

  # Run all tests, sharded by package group: parallel shards cut the
  # wall-clock (the TUI suite alone is ~27s; serially it queues behind
  # everything else) and a failure surfaces on its own shard instead of
  # hiding at the tail of one serial log. Each matrix entry resolves its
  # package list via scripts/test-shards.sh (no shell substitution in
  # the YAML literal — the stash-era matrix embedded a $(go list ...)
  # inside the matrix, which is fragile). The script's coverage command
  # is the drift guard: a package in no shard fails the gates job.
  #
  # Shard rules (see scripts/test-shards.sh header for the contract):
  #   tui  — internal/interface/tui alone (the long pole)
  #   core — internal/core + internal/agent
  #   rest — everything else, computed by filtering `go list ./...`
  # Race runs on the same shards, non-blocking (as before).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [tui, core, rest]
    name: test (${{ matrix.shard }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve shard packages
        run: |
          pkgs=$(sh scripts/test-shards.sh list "${{ matrix.shard }}" | tr '\n' ' ')
          if [ -z "$pkgs" ]; then
            echo "shard ${{ matrix.shard }} resolved to zero packages" >&2
            exit 1
          fi
          echo "pkgs=$pkgs" >> "$GITHUB_ENV"

      - name: Run tests
        run: go test -timeout 15m $pkgs
        env:
          GOMEMLIMIT: 6GiB

      - name: Run tests with race detector
        run: go test -race -timeout 15m $pkgs
        env:
          GOMEMLIMIT: 6GiB
        continue-on-error: true

  # Keep the required "test" check stable while testing in parallel.
  test-summary:
    name: test
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every test shard to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success

  # Code quality checks
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "The following files need formatting:"
            gofmt -l .
            exit 1
          fi

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
          install-go: false

  # Release-branch naming discipline: any release/* branch must be named
  # exactly release/X.Y.Z — free-form suffixes broke the version story in
  # 0.3.25/0.3.26 (tag derived from branch no longer matched what shipped).
  branch-naming:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release branch name
        if: github.head_ref != ''
        run: ./scripts/check-branch-name.sh "${{ github.head_ref }}"

      - name: Run naming-gate unit tests
        run: sh scripts/test-check-branch-name.sh

      - name: Run version-gate unit tests
        run: sh scripts/test-check-version-matches.sh

      - name: Run test-shard coverage unit tests
        run: |
          bash scripts/test-test-shards.sh
          sh scripts/test-shards-exact.sh

      - name: Run shard coverage drift guard
        run: sh scripts/test-shards.sh coverage

      # Note: version-bump verification intentionally does NOT run here.
      # A release/* PR legitimately carries no bump commit yet — the bump
      # lands at release time, and the tag is the release promise. The
      # gate lives in release.yml (tag push), before any build.

  # SBOM Generation
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30

  # Security scanning
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run vulnerability scan
        # govulncheck exits 1 on reachable vulnerabilities and 3 when
        # findings exist only in unreachable code (e.g. the deprecated
        # x/crypto/openpgp advisory, which has no fixed version). CI
        # fails on reachable findings; unreachable advisories are noise.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || [ $? -eq 3 ]

  # Secret scanning
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
