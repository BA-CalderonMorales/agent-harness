# Continuous Integration for Agent Harness
# Runs on all PRs and pushes to main/develop

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.25'

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  # Build and basic checks
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build -v ./cmd/agent-harness

      - name: Build with kairos tag
        run: go build -tags kairos -v ./cmd/agent-harness
        continue-on-error: true

  # Run all tests
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: go test -v -timeout 15m ./...
        env:
          GOMEMLIMIT: 6GiB

      - name: Run tests with race detector
        run: go test -race -timeout 15m ./...
        env:
          GOMEMLIMIT: 6GiB
        continue-on-error: true

  # Code quality checks
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "The following files need formatting:"
            gofmt -l .
            exit 1
          fi

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
          install-go: false

  # Release-branch naming discipline: any release/* branch must be named
  # exactly release/X.Y.Z — free-form suffixes broke the version story in
  # 0.3.25/0.3.26 (tag derived from branch no longer matched what shipped).
  branch-naming:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release branch name
        if: github.head_ref != ''
        run: ./scripts/check-branch-name.sh "${{ github.head_ref }}"

      - name: Run naming-gate unit tests
        run: sh scripts/test-check-branch-name.sh

      - name: Run version-gate unit tests
        run: sh scripts/test-check-version-matches.sh

      # Note: version-bump verification intentionally does NOT run here.
      # A release/* PR legitimately carries no bump commit yet — the bump
      # lands at release time, and the tag is the release promise. The
      # gate lives in release.yml (tag push), before any build.
        run: sh scripts/test-check-version-matches.sh

  # SBOM Generation
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30

  # Security scanning
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run vulnerability scan
        # govulncheck exits 1 on reachable vulnerabilities and 3 when
        # findings exist only in unreachable code (e.g. the deprecated
        # x/crypto/openpgp advisory, which has no fixed version). CI
        # fails on reachable findings; unreachable advisories are noise.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || [ $? -eq 3 ]

  # Secret scanning
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
